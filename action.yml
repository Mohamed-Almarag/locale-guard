name: Locale Guard
description:
  Check translation files on every pull request for missing keys, broken
  placeholders and untranslated text.
author: Mohamed Almearag

branding:
  icon: globe
  color: blue

# Inputs have no `default` here on purpose: defaults are applied in code, so a
# value from .localeguard.yml is not overridden by an input the user never set.
inputs:
  files:
    description: >
      Where the locale files are, with {locale} in place of the language code.
      Several patterns can be given, one per line. Examples:
      locales/{locale}.json, messages/{locale}.json, locales/{locale}/*.json
    required: false
  format:
    description: >
      The library that reads your messages. vue-i18n syntax: vue-i18n,
      @nuxtjs/i18n. ICU syntax: icu, next-intl, use-intl, react-intl, formatjs.
      Plain JSON: json, i18next, react-i18next, next-i18next, i18next-vue.
      Default: json.
    required: false
  base-locale:
    description: 'The locale every other locale is compared with. Default: en.'
    required: false
  fail-on:
    description:
      'When the check fails: error, warning or never. Default: error.'
    required: false
  fail-on-existing:
    description:
      'Also fail on issues that existed before the pull request. Default: false.'
    required: false
  comment:
    description:
      'Write a single pull request comment that is updated on every run.
      Default: true.'
    required: false
  annotations:
    description:
      'Mark issues on their line in the "Files changed" tab. Default: true.'
    required: false
  ignore-keys:
    description:
      'Key patterns to skip, one per line or comma separated, e.g. legacy.*'
    required: false
  ignore-locales:
    description:
      'Locales to skip, e.g. locales that are still being translated.'
    required: false
  ignore-values:
    description:
      'Values that may stay untranslated, e.g. brand names like "Google" or
      "OK".'
    required: false
  disable-checks:
    description: >
      Checks to turn off: missing-keys, extra-keys, empty-values,
      invalid-syntax, placeholder-mismatch, broken-linked-messages,
      untranslated, plural-forms, parse-error.
    required: false
  config-file:
    description:
      'Optional settings file. Inputs that are set win over it. Default:
      .localeguard.yml'
    required: false
  github-token:
    description: Token used to read the pull request and write the comment.
    required: false
    default: ${{ github.token }}

runs:
  using: node24
  main: dist/index.js
