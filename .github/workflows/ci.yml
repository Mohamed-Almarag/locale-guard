name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Typecheck
        id: npm-typecheck
        run: npm run typecheck

      - name: Test
        id: npm-test
        run: npm test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      # Runs the bundled action on the fixtures. They contain intentional issues,
      # so it only reports.
      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          files: tests/fixtures/vue-project/locales/{locale}.json
          format: vue-i18n
          fail-on: never
          comment: false
