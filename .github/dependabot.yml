version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - patch
    ignore:
      # Types must match the runtime in action.yml (node24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Major TypeScript releases need a manual check with the Rollup plugin.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
