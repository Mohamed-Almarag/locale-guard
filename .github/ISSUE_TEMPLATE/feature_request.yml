name: Feature request
description: A new check, format or input
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description:
        What goes wrong in your project today? A real example helps most.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Locale Guard do?
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: Format
      description: Which translation library it is for, or "all".
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label:
            I would like to open a pull request for this after we agree on it.
